<!-- Основные переиспользуемые компоненты (UI / Общие)Header.jsx (или .tsx) 
 — шапка приложения с логотипом InvestIQ и профилем пользователя.   
 Button.jsx — кнопки действий (например, оранжевые кнопки «Войти», «Добавить» и т.д.).   
 Input.jsx — поля ввода для форм авторизации и ввода данных.   
 Modal.jsx — всплывающее / модальное окно (02-modal).   
 Компоненты страниц и блоковAuthForm.jsx — форма входа / регистрации на начальном экране (01-home).  
 TransactionTable.jsx — таблица/список транзакций (экраны 02, 4, 5).   
 TransactionForm.jsx — форма для добавления новой транзакции/расхода.   
 SummaryCard.jsx / Balance.jsx — карточки с общим балансом и сводкой.   
 CategoryIcons.jsx — блок/сетка с иконками категорий (экран 03-report).   
 Chart.jsx (или ReportChart.jsx) — диаграммы и гистограммы отчетов (экран 03-report).    -->
